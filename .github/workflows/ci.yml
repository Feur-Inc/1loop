name: CI and alpha releases

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -p=2

# A dev publication and its retention cleanup must finish before the next one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# mopi is temporarily excluded until its build dependencies are prepared.
# To share work with mopi again, remove TPM28_RUNNER from each runs-on list.
jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref != 'refs/heads/dev')
    runs-on: [self-hosted, Linux, X64, TPM28_RUNNER]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, android]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify
        uses: ./.github/actions/build-and-verify
        with:
          platform: ${{ matrix.platform }}

  prepare-alpha:
    name: Prepare private draft for dev builds
    if: >-
      github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, TPM28_RUNNER]
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Create or reuse this run's draft
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="alpha-$GITHUB_RUN_ID"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish); then
            test "$(jq -r .isDraft <<< "$release")" = true
            test "$(jq -r .targetCommitish <<< "$release")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "1loop $tag" --notes "Test builds from $GITHUB_SHA."
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build-alpha:
    name: Build alpha ${{ matrix.platform }}
    needs: prepare-alpha
    runs-on: [self-hosted, Linux, X64, TPM28_RUNNER]
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, android]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the Android publication key
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_BUNDLE" || { echo 'Missing ANDROID_SIGNING_BUNDLE secret' >&2; exit 1; }
          umask 077
          signing="$RUNNER_TEMP/android-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$signing"
          printf '%s' "$ANDROID_SIGNING_BUNDLE" | base64 --decode | tar -xz -C "$signing" -- 1loop-release.p12 release.properties
          printf 'ONELOOP_ANDROID_SIGNING_PROPERTIES=%s/release.properties\n' "$signing" >> "$GITHUB_ENV"
      - name: Build and verify
        uses: ./.github/actions/build-and-verify
        with:
          platform: ${{ matrix.platform }}
      - name: Upload checked builds to the private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-alpha.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/ci/* --clobber
      - name: Remove temporary Android credentials
        if: always() && matrix.platform == 'android'
        shell: bash
        run: |
          signing="$RUNNER_TEMP/android-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -d $signing ]]; then
            rm -f -- "$signing/1loop-release.p12" "$signing/release.properties"
            rmdir -- "$signing"
          fi

  publish-alpha:
    name: Sign and publish complete alpha
    needs: [prepare-alpha, build-alpha]
    runs-on: [self-hosted, Linux, X64, TPM28_RUNNER]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sign, publish and retain three alpha releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-alpha.outputs.tag }}
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_KEY }}
        run: |
          set -euo pipefail

          : "${GH_REPO:?}" "${RELEASE_TAG:?}" "${RELEASE_KEY_PEM:?}"
          version=$(cat VERSION)
          work=$(mktemp -d "$RUNNER_TEMP/1loop-alpha.XXXXXX")
          key=$work/release-key.pem
          trap 'rm -f -- "$key"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_KEY_PEM" > "$key"
          openssl pkey -in "$key" -pubout -out "$work/release-key.pub"
          cmp .github/release-key.pub "$work/release-key.pub"

          assets=(
            "1loop-$version-linux-amd64.tar.gz"
            "1loop-$version-amd64.deb"
            "1loop-$version-x86_64.AppImage"
            "1loop-server-$version-linux-amd64"
            "1loop-$version-windows-amd64.zip"
            "1loop-server-$version-windows-amd64.exe"
            "1loop-$version.apk"
            "1loop-$version-android-native-sources.zip"
          )
          release=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)
          test "$(jq -r .isDraft <<< "$release")" = true
          test "$(jq -r .targetCommitish <<< "$release")" = "$GITHUB_SHA"
          unexpected=$(jq -r --args '.assets[] | .name as $name |
            select($ARGS.positional | index($name) | not) | $name' \
            "${assets[@]}" SHA256SUMS SHA256SUMS.sig release-key.pub <<< "$release")
          if [[ -n $unexpected ]]; then
            printf 'Unexpected release assets; refusing publication:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          gh release download "$RELEASE_TAG" --dir "$work"
          for asset in "${assets[@]}"; do test -s "$work/$asset"; done
          (
            cd "$work"
            sha256sum "${assets[@]}" > SHA256SUMS
          )
          openssl dgst -sha256 -sign "$key" -out "$work/SHA256SUMS.sig" "$work/SHA256SUMS"
          openssl dgst -sha256 -verify .github/release-key.pub \
            -signature "$work/SHA256SUMS.sig" "$work/SHA256SUMS"
          gh release upload "$RELEASE_TAG" "$work/SHA256SUMS" "$work/SHA256SUMS.sig" \
            "$work/release-key.pub" --clobber
          cat > "$work/notes.md" <<NOTES
          Test build of 1loop $version from commit $GITHUB_SHA.

          Includes the Linux tarball, Debian package and AppImage (using the runner’s system libraries),
          Windows desktop with software renderer, both headless servers, and the Android APK
          plus its native corresponding sources. All platform checks passed before publication.
          Windows is cross-compiled directly with MinGW on Linux; Windows runtime tests are not executed here.

          Verify the downloads with the public key from this source commit:
          https://github.com/$GH_REPO/blob/$GITHUB_SHA/.github/release-key.pub

          \`\`\`sh
          openssl dgst -sha256 -verify release-key.pub -signature SHA256SUMS.sig SHA256SUMS
          sha256sum --check SHA256SUMS
          \`\`\`
          NOTES
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "$work/notes.md"

          # Match only our published alpha-N prereleases; stable and other releases stay intact.
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          stale=$(jq -r '[.[][] | select(.draft == false and .prerelease == true
            and (.tag_name | test("^alpha-[0-9]+$")))]
            | sort_by(.published_at, .id) | reverse | .[3:][] | .tag_name' <<< "$releases")
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$stale"
