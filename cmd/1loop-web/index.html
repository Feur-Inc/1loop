<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>1loop</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#ccc;font:14px sans-serif}canvas{display:block}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="loading">Loading 1loop…</div>
<script src="wasm_exec.js"></script>
<script>
// Load timings for the spike (#267): window.loopTimings.
window.loopTimings = {start: performance.now()};
const go = new Go();
WebAssembly.instantiateStreaming(fetch("1loop.wasm"), go.importObject).then(result => {
  window.loopTimings.instantiated = performance.now();
  document.getElementById("loading").remove();
  go.run(result.instance);
}).catch(err => {
  document.getElementById("loading").textContent = "1loop could not start: " + err;
});
</script>
</body>
</html>
