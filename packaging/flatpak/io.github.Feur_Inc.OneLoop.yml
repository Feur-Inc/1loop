# 1loop as a Flatpak, built from this repository:
#
#   flatpak-builder --user --install --force-clean build-flatpak \
#     packaging/flatpak/io.github.Feur_Inc.OneLoop.yml
#
# or `make flatpak` for a single-file bundle in dist/. The Go modules are
# downloaded during the build (--share=network): fine for local builds, not
# accepted by Flathub as it is.
#
# A coding agent works on the user's real system, so this is not a tight
# sandbox: it reads and writes the user's files, and runs its commands, its
# terminal, Git, the browser and Computer Use's helper on the host through
# flatpak-spawn (org.freedesktop.Flatpak). See packaging/flatpak/host-run and
# docs/INSTALL.md for what that changes.
id: io.github.Feur_Inc.OneLoop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: 1loop-flatpak
# Each permission says what needs it; docs/INSTALL.md says what stops working
# without it, and 1loop names a revoked one at start (platform/flatpak.go).
# Portals cover the rest without a static permission: the file and folder
# chooser (ui/filepicker.go), opening links and files (the runtime's
# xdg-open), notifications (ui/notify.go) and, for Computer Use, the
# RemoteDesktop and ScreenCast portals (called by its helper on the host).
# Nothing plays or records sound, so there is no --socket=pulseaudio.
finish-args:
  # The model providers' APIs, MCP servers, SSH machines, Browser Use and
  # the remote app.
  - --share=network
  # X11's shared memory, which the X11 build uses (fallback-x11 below).
  - --share=ipc
  # The window: 1loop-wayland on Wayland, the X11 build elsewhere.
  - --socket=wayland
  - --socket=fallback-x11
  # OpenGL rendering (Fyne draws with GL).
  - --device=dri
  # SSH machines can sign in with the session's SSH agent (SSH_AUTH_SOCK).
  - --socket=ssh-auth
  # A coding agent reads and edits the user's projects, which can be
  # anywhere (home, other disks, /srv, /mnt…), and its commands run on the
  # host in those same folders (below), so the paths must be the same on
  # both sides. Claude Code, on the host, also reads the MCP config and
  # skills 1loop writes for it (under TMPDIR, see 1loop-flatpak). A portal grants single files or folders at a time and gives
  # them a /run/user/…/doc path the host commands cannot use, so it cannot
  # replace this. --filesystem=home is enough for projects in the home
  # folder (see docs/INSTALL.md).
  - --filesystem=host
  # The agent's commands, its terminal, Git, Browser Use's Chromium,
  # Computer Use's Python helper and the Claude Code provider (the user's
  # own claude CLI, with its login in ~/.claude) must run with the user's
  # own tools and toolchains (compilers, package managers, language
  # servers, shells), which no runtime can ship: they run on the host
  # through flatpak-spawn --host (host-run, host-claude). This is what the app is for, not an escape hatch:
  # in Auto mode every command that is not plainly safe asks for the
  # user's approval, and the metainfo and docs say plainly that it runs on
  # the host.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: 1loop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      build-args:
        - --share=network
      env:
        # -modcacherw: flatpak-builder must be able to delete the build folder.
        GOFLAGS: -trimpath -modcacherw
        GOTOOLCHAIN: local
        GOPATH: /run/build/1loop/.go
        GOCACHE: /run/build/1loop/.go-cache
    sources:
      # Only build inputs: do not copy local tokens, signing keys or caches.
      - type: file
        path: ../../go.mod
      - type: file
        path: ../../go.sum
      - type: file
        path: ../../VERSION
      - type: dir
        path: ../../cmd
        dest: cmd
      - type: dir
        path: ../../internal
        dest: internal
      - type: dir
        path: ../../assets
        dest: assets
      - type: dir
        path: ../../third_party
        dest: third_party
      - type: dir
        path: .
        dest: packaging/flatpak
      - type: file
        path: ../linux/1loop.desktop
        dest: packaging/linux
    build-commands:
      - |
        flags="-s -w -X 1loop/internal/update.Version=$(cat VERSION) -X 1loop/internal/update.Packaged=Flatpak"
        go build -ldflags="$flags" -o build/1loop ./cmd/1loop
        CGO_CFLAGS="$(go env CGO_CFLAGS) -w" go build -ldflags="$flags" -tags wayland -o build/1loop-wayland ./cmd/1loop
        go build -o build/1loop-release ./cmd/1loop-release
      - install -Dm755 build/1loop build/1loop-wayland -t /app/lib/1loop
      - install -Dm755 packaging/flatpak/1loop-flatpak -t /app/bin
      - install -Dm755 packaging/flatpak/host-run packaging/flatpak/host-browser packaging/flatpak/host-claude packaging/flatpak/host-shell -t /app/lib/1loop/host
      - for name in bash git python3; do ln -s host-run /app/lib/1loop/host/$name; done
      - ln -s host-browser /app/lib/1loop/host/chromium
      - ln -s host-claude /app/lib/1loop/host/claude
      - build/1loop-release icons /app/share/icons io.github.Feur_Inc.OneLoop
      # The window keeps the app id 1loop: StartupWMClass ties it to this entry.
      - sed -e 's/^Exec=.*/Exec=1loop-flatpak/' -e 's/^Icon=.*/Icon=io.github.Feur_Inc.OneLoop/' packaging/linux/1loop.desktop
        | install -Dm644 /dev/stdin /app/share/applications/io.github.Feur_Inc.OneLoop.desktop
      - install -Dm644 packaging/flatpak/io.github.Feur_Inc.OneLoop.metainfo.xml -t /app/share/metainfo
