# GitHub honours "Closes #N" only for pull requests into the default branch
# (main), and pull requests here go to dev. Close the issues a merged pull
# request into dev cites, so the project's "Item closed" workflow moves them
# to Done.
name: Close issues fixed on dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close the cited issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The same keywords GitHub accepts; "Part of #N" leaves the issue open.
          issues=$(printf '%s\n%s\n' "$TITLE" "$BODY" \
            | grep -ioE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +(${GH_REPO})?#[0-9]+" \
            | grep -oE '[0-9]+$' | sort -un)
          for n in $issues; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null) || continue
            [ "$state" = OPEN ] && gh issue close "$n" --comment "Fixed on \`dev\` by #$PR."
          done
          true
