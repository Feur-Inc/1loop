name: CI and alpha releases

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Only the publisher needs write access. PR checks and ordinary CI are read-only.
permissions:
  contents: read

# Serialize publication and retention on each branch; do not cancel a running
# release after it has started uploading assets.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and verify all platforms
        uses: ./.github/actions/build-and-verify

  publish-alpha:
    name: Publish alpha (trusted dev push only)
    needs: verify
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # No Actions artifacts are used. Rebuild the same commit in this isolated,
      # write-scoped job only after read-only verification succeeds.
      - name: Rebuild and reverify for release
        uses: ./.github/actions/build-and-verify

      - name: Package and sign alpha builds
        id: alpha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_KEY }}
        run: |
          set -Eeuo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must have the form x.y.z, got: %s\n' "$version" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_KEY_PEM" ]]; then
            printf 'Configure the repository Actions secret RELEASE_KEY from the ignored release-key.pem.\n' >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:7}"
          latest_alpha="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[]
                | select(.draft == false and .prerelease == true
                    and (.tag_name | test("^alpha-[0-9]+$")))
                | (.tag_name | ltrimstr("alpha-") | tonumber)' \
              | sort -n \
              | tail -n 1
          )"
          latest_alpha="${latest_alpha:-0}"
          alpha_number=$((latest_alpha + 1))
          alpha_tag="alpha-${alpha_number}"
          release_dir="$RUNNER_TEMP/alpha-release"
          key_file="$RUNNER_TEMP/release-key.pem"
          mkdir -p "$release_dir"
          printf '%s\n' "$RELEASE_KEY_PEM" > "$key_file"
          chmod 0600 "$key_file"
          openssl pkey -in "$key_file" -check -noout
          openssl pkey -in "$key_file" -pubout -out "$RUNNER_TEMP/release-key.pub"
          cmp -- .github/release-key.pub "$RUNNER_TEMP/release-key.pub"

          linux_asset="1loop-linux-${alpha_tag}.tar.gz"
          linux_server_asset="1loop-server-linux-${alpha_tag}"
          windows_asset="1loop-windows-${alpha_tag}.zip"
          windows_server_asset="1loop-server-windows-${alpha_tag}.exe"
          android_asset="1loop-remote-${alpha_tag}.apk"
          tar -C bin -czf "$release_dir/$linux_asset" 1loop 1loop-wayland
          cp -- bin/1loop-server "$release_dir/$linux_server_asset"
          (cd bin/windows && zip -qr "$release_dir/$windows_asset" .)
          cp -- bin/windows/1loop-server.exe "$release_dir/$windows_server_asset"
          cp -- android/app/build/outputs/apk/release/app-release.apk "$release_dir/$android_asset"
          cp -- .github/release-key.pub "$release_dir/release-key.pub"

          assets=(
            "$linux_asset"
            "$linux_server_asset"
            "$windows_asset"
            "$windows_server_asset"
            "$android_asset"
          )
          for asset in "${assets[@]}"; do
            test -s "$release_dir/$asset"
          done
          (
            cd "$release_dir"
            sha256sum "${assets[@]}" > SHA256SUMS
          )
          openssl dgst -sha256 -sign "$key_file" \
            -out "$release_dir/SHA256SUMS.sig" "$release_dir/SHA256SUMS"
          openssl dgst -sha256 -verify .github/release-key.pub \
            -signature "$release_dir/SHA256SUMS.sig" "$release_dir/SHA256SUMS"

          title="Alpha ${alpha_number}"
          notes="$RUNNER_TEMP/alpha-release-notes.md"
          cat > "$notes" <<EOF
          Automated test build for 1loop ${version} (commit ${GITHUB_SHA}, ${short_sha}).

          Includes Linux X11/Wayland and headless server builds, Windows desktop and server builds, and an Android APK.

          Verify the signed checksums from this release:

          \`\`\`sh
          openssl dgst -sha256 -verify release-key.pub -signature SHA256SUMS.sig SHA256SUMS
          sha256sum --check SHA256SUMS
          \`\`\`

          Public key source for this commit:
          https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/.github/release-key.pub
          EOF
          {
            printf 'tag=%s\n' "$alpha_tag"
            printf 'title=%s\n' "$title"
            printf 'assets=%s\n' "$release_dir"
            printf 'notes=%s\n' "$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Publish alpha prerelease
        if: steps.alpha.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.alpha.outputs.tag }}
          RELEASE_TITLE: ${{ steps.alpha.outputs.title }}
          RELEASE_ASSETS: ${{ steps.alpha.outputs.assets }}
          RELEASE_NOTES: ${{ steps.alpha.outputs.notes }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_ASSETS"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            --prerelease

      - name: Keep only the three newest alpha prereleases
        if: steps.alpha.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          alpha_rows="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[]
                | select(.draft == false and .prerelease == true
                    and (.tag_name | startswith("alpha-")))
                | [.created_at, .id, .tag_name] | @tsv'
          )"
          mapfile -t stale_tags < <(
            printf '%s\n' "$alpha_rows" \
              | LC_ALL=C sort -k1,1r -k2,2nr \
              | tail -n +4 \
              | cut -f3-
          )
          for stale_tag in "${stale_tags[@]}"; do
            [ -n "$stale_tag" ] || continue
            printf 'Deleting older alpha release %s\n' "$stale_tag"
            gh release delete "$stale_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
