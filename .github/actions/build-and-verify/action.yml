name: Build and verify 1loop

description: Run one platform's checks and package its downloads using the local CI script.

inputs:
  platform:
    description: linux, windows or android
    required: true

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Set up Java 21
      if: inputs.platform == 'android'
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK tools
      if: inputs.platform == 'android'
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools

    - name: Check preinstalled runner dependencies
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        commands=(python3)
        if [[ $PLATFORM == android ]]; then
          commands+=(make cmake patch patchelf dpkg-deb)
        else
          commands+=(docker zip)
          docker version
        fi
        if [[ $PLATFORM == linux ]]; then
          commands+=(gcc make pkg-config dpkg-deb objdump)
          if ! pkg-config --exists gl x11 xrandr xxf86vm xi xcursor xinerama wayland-client xkbcommon; then
            echo 'Install Linux headers on this runner: apt-get install build-essential libgl-dev xorg-dev libwayland-dev libxkbcommon-dev' >&2
            exit 1
          fi
        fi
        for command in "${commands[@]}"; do
          command -v "$command" >/dev/null || {
            echo "Missing runner dependency: $command. See README.md → Self-hosted CI." >&2
            exit 1
          }
        done

    - name: Install Android platform and NDK
      if: inputs.platform == 'android'
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager --sdk_root="$ANDROID_HOME" --install \
          'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'

    - name: Build, check and package
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        DEB_MAINTAINER: TPM28 <77407722+tpm28@users.noreply.github.com>
      run: bash ci.sh "$PLATFORM"
