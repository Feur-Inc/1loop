name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System libraries (Fyne, X11, Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Not formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Build (X11 and Wayland)
        run: make build
      - name: Test
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: bin/
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  alpha-release:
    name: Alpha release
    needs: [desktop, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          tag="alpha-${{ github.run_number }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir out
          tar -C dist/desktop-linux -czf "out/1loop-linux-$tag.tar.gz" .
          cp dist/android-apk/*.apk "out/1loop-remote-$tag.apk"
      - name: Publish
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Alpha ${{ github.run_number }}" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Desktop: Linux x86_64 (X11 and Wayland). Phone remote: debug APK."
      - name: Keep only the newest alphas
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("alpha-")))] | sort_by(.createdAt) | reverse | .['"$KEEP"':][].tagName' |
          while read -r old; do
            echo "Deleting $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
